<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        try {
          var saved = null;
          try {
            saved = window.localStorage.getItem('qc-theme');
          } catch (e) {}
          var theme;
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            try {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            } catch (e) {
              theme = 'light';
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>
    <title>Qrati Connect — Ember Example</title>
    <meta name="description" content="Embed a live event photo gallery in Ember with guest uploads, lightbox, reactions, and contest leaderboards.">

    <link rel="icon" type="image/svg+xml" href="/connect/ember-example/qrati-logo-square.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/connect/ember-example/qrati-connect-logo-square.png">
    <link rel="apple-touch-icon" href="/connect/ember-example/qrati-connect-logo-square.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qrati.com/connect/ember-example">
